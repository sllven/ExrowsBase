# Redis is optional (see README "Cache"). The app's research-result cache
# works out of the box using the database with a TTL, with no Redis
# required. Uncomment REDIS_URL below and the `redis` service to opt in.
services:
  app:
    build: .
    ports:
      - "8000:8000"
    env_file:
      - .env
    environment:
      - DATABASE_URL=sqlite:////app/data/uniview.db
      # - REDIS_URL=redis://redis:6379/0
    volumes:
      - uniview-data:/app/data

  # redis:
  #   image: redis:7-alpine
  #   ports:
  #     - "6379:6379"
  #   volumes:
  #     - redis-data:/data

volumes:
  uniview-data:
  # redis-data:
